[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "2m-ticket-booking"
version = "0.1.0"
description = "Distributed ticket booking platform with booking safety guarantees"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "python-multipart>=0.0.9",
  "websockets>=12.0",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2"]
dev = ["pytest>=8.2", "httpx>=0.27", "anyio>=4.4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

