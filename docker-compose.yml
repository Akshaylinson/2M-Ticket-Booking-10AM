version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ticketing
      POSTGRES_USER: ticketing
      POSTGRES_PASSWORD: ticketing
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'

  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://ticketing:ticketing@postgres:5432/ticketing
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: change-me-in-production
      ACCESS_TOKEN_MINUTES: 60
      BOOKING_HOLD_SECONDS: 120
    depends_on:
      - postgres
      - redis
    ports:
      - '8000:8000'

  frontend:
    build:
      context: ./frontend
    depends_on:
      - backend
    ports:
      - '3000:80'

volumes:
  postgres_data:
